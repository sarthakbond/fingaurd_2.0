# ==============================================================================
# FinGuard 2.0 — Pellav2 Stage 1 Fine-Tuning Configuration
# Target Hardware: NVIDIA RTX 4050 Laptop GPU (6GB VRAM), Windows x64
# ==============================================================================

model:
  base_checkpoint: "E:\\project models\\pellav2_detector.pt"
  wav2vec2_config_id: "facebook/wav2vec2-xls-r-300m"
  freeze_backbone: true
  train_layer_weights: true
  train_head: true

data:
  dataset_root: "E:\\datasets"
  train_manifest: "E:\\datasets\\splits\\train_manifest.json"
  val_manifest: "E:\\datasets\\splits\\val_manifest.json"
  locked_test_manifest: "E:\\datasets\\splits\\locked_test_manifest.json"
  diagnostic_manifest: "E:\\datasets\\splits\\diagnostic_manifest.json"
  target_sample_rate: 16000
  target_length_samples: 64000  # Exactly 4.0 seconds at 16 kHz
  num_workers: 0               # Safe single-process dataloading on Windows

training:
  seed: 42
  batch_size: 8                # Fits in ~1.9 GB VRAM on RTX 4050
  learning_rate: 0.0001        # Conservative 1e-4 for head/fusion layers
  weight_decay: 0.01
  epochs: 10
  gradient_clip_norm: 1.0
  use_amp: true                # Automatic Mixed Precision (float16)
  early_stopping_patience: 3
  early_stopping_metric: "val_roc_auc"
  pos_weight: 1.0              # 1:1 balanced training set
  eval_threshold: 0.50

experiments:
  output_dir: "E:\\datasets\\experiments\\pellav2_stage1"
  save_best_only: true
